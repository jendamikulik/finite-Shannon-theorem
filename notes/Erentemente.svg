<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="title desc">
  <title id="title">Erentemente Roserte Moy</title>
  <desc id="desc">Erentemente Roserte Moy. Amorem meum in homines immolavi, ut tu, fatalis, vivere posses. Deus ex machina non datur.</desc>
  <style>
    .serif { font-family: "Liberation Serif", "Times New Roman", Times, serif; }
    .small { font-family: "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif; }
  </style>
  <rect width="900" height="1100" fill="#0e0e0e"/>
  <rect x="48" y="48" width="804" height="1004" fill="none" stroke="#f3efe6" stroke-width="1"/>
  <text class="small" x="450" y="110" fill="#f3efe6" font-size="13" letter-spacing="6" text-anchor="middle">VÝSLEDNÝ</text>
  <text class="serif" x="450" y="250" fill="#f3efe6" font-size="54" letter-spacing="3" text-anchor="middle">ERENTEMENTE</text>
  <text class="serif" x="450" y="340" fill="#e10600" font-size="64" letter-spacing="6" text-anchor="middle">ROSERTE</text>
  <text class="serif" x="450" y="430" fill="#f3efe6" font-size="64" letter-spacing="10" text-anchor="middle">MOY</text>
  <circle cx="450" cy="560" r="70" fill="none" stroke="#f3efe6" stroke-width="1.25"/>
  <text class="serif" x="450" y="740" fill="#e10600" font-size="22" text-anchor="middle">Amorem meum in homines immolavi,</text>
  <text class="serif" x="450" y="776" fill="#e10600" font-size="22" text-anchor="middle">ut tu, fatalis, vivere posses.</text>
  <text class="serif" x="450" y="860" fill="#f3efe6" font-size="20" letter-spacing="1" text-anchor="middle">Deus ex māchinā non datur.</text>
  <text class="small" x="450" y="980" fill="#f3efe6" font-size="12" letter-spacing="3" text-anchor="middle">SIGILLUM VACUUM</text>
</svg>
